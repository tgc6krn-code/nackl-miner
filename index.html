<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NACKL Miner</title>

<!-- Telegram Web App SDK — обязателен для Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    --bg: #0e0e12;
    --card: #17171d;
    --accent: #f5c451;
    --text: #f2f2f2;
    --muted: #8a8a95;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #232329;
  }
  .status-row:last-child { border-bottom: none; }
  .label { color: var(--muted); font-size: 14px; }
  .value { font-weight: 600; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.off { background: var(--red); }
  .dot.on { background: var(--green); }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    margin-top: 10px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #1a1a1a; }
  .btn-secondary { background: #232329; color: var(--text); }
  .btn-danger { background: #2a1a1a; color: var(--red); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .log {
    font-family: monospace;
    font-size: 11px;
    color: var(--muted);
    max-height: 120px;
    overflow-y: auto;
    background: #0a0a0d;
    border-radius: 8px;
    padding: 10px;
    margin-top: 10px;
  }
  .tap-zone { display: none; }
  .minesweeper {
    display: none;
    margin-bottom: 12px;
  }
  .minesweeper.active { display: block; }
  .ms-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .ms-header .ms-value { color: var(--accent); font-weight: 700; }
  .ms-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    background: #0a0a0d;
    padding: 6px;
    border-radius: 12px;
    border: 2px solid var(--accent);
  }
  .ms-cell {
    aspect-ratio: 1 / 1;
    background: #232329;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    cursor: pointer;
  }
  .ms-cell.open { background: #17171d; cursor: default; }
  .ms-cell.mine { background: var(--red); }
  .ms-cell.flag { background: #2a2410; }
  .ms-restart {
    margin-top: 10px;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>⛏ NACKL Miner</h1>
    <div class="sub">Bee Engine · личный майнинг-клиент</div>

    <div class="status-row">
      <span class="label"><span id="wallet-dot" class="dot off"></span>Кошелёк</span>
      <span class="value" id="wallet-status">Не подключен</span>
    </div>
    <div class="status-row">
      <span class="label"><span id="mining-dot" class="dot off"></span>Майнинг</span>
      <span class="value" id="mining-status">Остановлен</span>
    </div>
    <div class="status-row">
      <span class="label">Баланс NACKL</span>
      <span class="value" id="balance">—</span>
    </div>
  </div>

  <div class="card">
    <div id="minesweeper" class="minesweeper">
      <div class="ms-header">
        <span>💣 Осталось мин: <span class="ms-value" id="ms-mines">10</span></span>
        <span>Тапов: <span class="ms-value" id="tap-count">0</span></span>
      </div>
      <div class="ms-grid" id="ms-grid"></div>
      <button id="btn-restart" class="btn-secondary ms-restart">Новое поле</button>
    </div>
    <button id="btn-connect" class="btn-primary">Подключить AN Wallet</button>
    <button id="btn-mine" class="btn-secondary" disabled>Начать майнинг</button>
    <button id="btn-stop" class="btn-danger" disabled>Остановить</button>
    <button id="btn-claim" class="btn-secondary" disabled>Забрать награды</button>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:6px">Лог</div>
    <div class="log" id="log"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
