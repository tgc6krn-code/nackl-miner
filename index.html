<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NACKL Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{--bg:#0e0e12;--card:#17171d;--accent:#f5c451;--text:#f2f2f2;--muted:#8a8a95;--green:#4ade80;--red:#f87171}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}.card{background:var(--card);border-radius:16px;margin-bottom:16px;padding:20px}h1{margin:0 0 4px;font-size:20px}.sub{color:var(--muted);margin-bottom:16px;font-size:13px}.status-row{border-bottom:1px solid #232329;justify-content:space-between;align-items:center;padding:10px 0;display:flex}.status-row:last-child{border-bottom:none}.label{color:var(--muted);font-size:14px}.value{font-size:14px;font-weight:600}.dot{border-radius:50%;width:8px;height:8px;margin-right:6px;display:inline-block}.dot.off{background:var(--red)}.dot.on{background:var(--green)}.dot.pending{background:var(--accent)}input[type=text]{width:100%;color:var(--text);background:#0a0a0d;border:1px solid #2a2a32;border-radius:10px;margin-bottom:10px;padding:12px;font-size:15px}button{cursor:pointer;border:none;border-radius:12px;width:100%;margin-top:10px;padding:14px;font-size:15px;font-weight:600}.btn-primary{background:var(--accent);color:#1a1a1a}.btn-secondary{color:var(--text);background:#232329}.btn-danger{color:var(--red);background:#2a1a1a}button:disabled{opacity:.4;cursor:not-allowed}.deep-link{text-align:center;text-decoration:none;display:block}.log{color:var(--muted);background:#0a0a0d;border-radius:8px;max-height:140px;margin-top:10px;padding:10px;font-family:monospace;font-size:11px;overflow-y:auto}.minesweeper{margin-bottom:12px;display:none}.minesweeper.active{display:block}.ms-header{color:var(--muted);justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;display:flex}.ms-header .ms-value{color:var(--accent);font-weight:700}.ms-grid{border:2px solid var(--accent);background:#0a0a0d;border-radius:12px;grid-template-columns:repeat(8,1fr);gap:3px;padding:6px;display:grid}.ms-cell{aspect-ratio:1;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer;background:#232329;border-radius:4px;justify-content:center;align-items:center;font-size:13px;font-weight:700;display:flex}.ms-cell.open{cursor:default;background:#17171d}.ms-cell.mine{background:var(--red)}.ms-cell.flag{background:#2a2410}.ms-restart{margin-top:10px}</style>
  <script type="module" crossorigin src="./index-BQSxSfNj.js"></script>
</head>
<body>

  <div class="card">
    <h1>⛏ NACKL Miner</h1>
    <div class="sub">Bee Engine · личный майнинг-клиент</div>

    <div class="status-row">
      <span class="label"><span id="wallet-dot" class="dot off"></span>Кошелёк</span>
      <span class="value" id="wallet-status">Не подключен</span>
    </div>
    <div class="status-row">
      <span class="label"><span id="mining-dot" class="dot off"></span>Майнинг</span>
      <span class="value" id="mining-status">Остановлен</span>
    </div>
    <div class="status-row">
      <span class="label">Баланс NACKL</span>
      <span class="value" id="balance">—</span>
    </div>
  </div>

  <div class="card" id="connect-card">
    <input type="text" id="wallet-name-input" placeholder="Имя твоего AN Wallet">
    <button id="btn-connect" class="btn-primary">Подключить AN Wallet</button>
    <a id="deep-link" class="deep-link" style="display:none" target="_blank">
      <button class="btn-secondary" type="button">Открыть AN Wallet для подтверждения</button>
    </a>
    <button id="btn-confirmed" class="btn-primary" style="display:none">Я подтвердил в AN Wallet →</button>
  </div>

  <div class="card">
    <div id="minesweeper" class="minesweeper">
      <div class="ms-header">
        <span>💣 Мин: <span class="ms-value" id="ms-mines">10</span></span>
        <span>Открыто: <span class="ms-value" id="cell-count">0</span></span>
      </div>
      <div class="ms-header" style="margin-top:-8px">
        <span>Отправлено в сеть: <span class="ms-value" id="tap-count">0</span></span>
      </div>
      <div class="ms-grid" id="ms-grid"></div>
      <button id="btn-restart" class="btn-secondary ms-restart">Новое поле</button>
    </div>
    <button id="btn-mine" class="btn-secondary" disabled>Начать майнинг</button>
    <button id="btn-stop" class="btn-danger" disabled>Остановить</button>
    <button id="btn-status" class="btn-secondary" disabled>Проверить статус майнера</button>
    <button id="btn-forget" class="btn-danger">Забыть кошелёк и переподключить заново</button>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:6px">Лог</div>
    <div class="log" id="log"></div>
  </div>

</body>
</html>
